name: Validar V10
on:
  push:
    branches: [feature/v10-reformulacao]
  pull_request:
    branches: [main]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check v10-ui.js
      - run: node --check v10-core.js
      - run: node --check functions/api/_lib.js
      - run: node --check functions/api/admin/videos.js
      - run: node --check 'functions/api/video/[name].js'
