<style>

in-top:7px}main{max-width:1100px;margin:auto;padding:16px 18px 80px}.banner{background:linear-gradient(120deg,#181113 0,#201412 38%,#111111 100%);border:1px solid #fa8a2540;min-height:200px;border-radius:22px;padding:25px;margin-top:13px;position:relative;overflow:hidden}.banner:after{content:'V10';position:absolute;font:190px Anton;right:-19px;top:0;color:#ff8b270e;pointer-events:none}.kicker{color:#ffa653;text-transform:uppercase;letter-spacing:2.3px;font:800 10px Outfit}.banner h1{font:clamp(38px,7vw,64px)/.98 Impact,sans-serif;margin:14px 0;max-width:600px}.banner h1 em{font-style:normal;color:var(--accent)}.banner p{color:#c4bbb4;max-width:540px;font-size:14px;line-height:1.55;margin:0 0 20px}.tagline{display:inline-block;background:#0c0c0e;border:1px solid #ffffff2b;color:#ffbd82;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:800;letter-spacing:.7px}.twocol{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.section{margin:25px 0 0;border-radius:19px;border:1px solid var(--edge);padding:22px;background:linear-gradient(130deg,#1a1515,#111113 85%)}.section h2,.pageHead h2{font:clamp(27px,4vw,37px)/1.07 Anton;margin:9px 0 17px}.section p{line-height:1.5}.hint{color:var(--muted);font-size:12px;line-height:1.5}.muted{color:var(--muted)}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{padding:11px 15px;border:1px solid #ffffff35;background:#212123;border-radius:10px;color:#f7f3ed;font-weight:700;font-size:13px}.btn.orange{border-color:#ee873a;background:linear-gradient(135deg,#fa982e,#c65a1f);color:#17100a}.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.45;cursor:not-allowed}.hall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.hallCard{min-width:0;background:linear-gradient(145deg,#221d1b,#121214);border:1px solid #ffffff25;border-radius:15px;padding:14px 7px;display:flex;flex-direction:column;gap:7px;align-items:center;text-align:center}.hallCard:first-child{background:linear-gradient(145deg,#4a2c1a,#171315);border-color:#ffb05a7d}.hallCard .place{font:800 11px Arial;color:#ffae68}.avatar{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;background:linear-gradient(135deg,#49301f,#24272e);border:2px solid #ef853d;color:#fff;border-radius:50%;width:66px;height:66px;font:28px Anton}.hallCard .avatar{width:86px;height:86px;font-size:34px}.hallCard strong{font-size:clamp(13px,2vw,18px);overflow-wrap:anywhere;line-height:1.12}.hallCard .titles{color:#ffbd85;font-size:12px;font-weight:800}.card{background:#171719;border:1px solid #ffffff20;border-radius:14px;padding:14px;min-width:0}.face{display:flex;align-items:center;gap:10px}.face strong{display:block;font-size:15px}.face small{display:block;color:#aaa;font-size:12px;margin-top:4px}.tablewrap{overflow:auto;max-width:100%;border:1px solid var(--edge);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:440px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #ffffff17;font-size:13px}th{font-size:11px;color:#ffa259;text-transform:uppercase;letter-spacing:1px;background:#221a17}td:first-child{font-weight:800;color:#ffba7c}tr:last-child td{border-bottom:0}td button{background:none;border:0;color:inherit;text-align:left}.rowAvatar{width:35px;height:35px;font:16px Anton;border-width:1px}.rankGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.rankCard{display:flex;gap:13px;align-items:center}.rankCard span:last-child{color:#ffae70;font-weight:800;white-space:nowrap;margin-left:auto}.rankCard .avatar{width:52px;height:52px;font-size:22px}.rankCard small{color:#aaa;display:block}.compare{display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr);align-items:center;gap:6px}.fighter{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}.fighter .avatar{width:100px;height:100px;font-size:42px}.fighter select{max-width:100%;font-weight:700}.fighter strong{color:#ffc18d}.vs{text-align:center;display:flex;flex-direction:column;gap:6px}.vs b{font:40px Anton;color:#ff8b26}.vs strong{font-size:18px}.vs small{font-size:11px;color:#aaa}.select,.input,.textarea{width:100%;border:1px solid #ffffff37;background:#101012;color:#eee;border-radius:9px;padding:11px;font-size:14px;min-height:43px}.input[type=number]{max-width:140px}.label{display:block;font-size:12px;color:#ffc18c;font-weight:700;margin:13px 0 6px}.match{border:1px solid #ffffff26;background:#141416;padding:12px;border-radius:13px;margin:9px 0}.participant{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;margin:3px 0;border:1px solid #ffffff1c;border-radius:8px}.participant.win{background:#245e3240;border-color:#5adf694a}.participant small{font-size:11px;color:#eee}.score{color:#ffbe8a;font-weight:800}.matchFoot{color:#ada39d;text-align:center;font-size:12px;margin-top:8px}.bracketStage{display:grid;grid-template-columns:1fr 1fr;gap:13px}.footLink{color:#ffa956;text-decoration:underline}.pageHead{padding:17px 2px}.pageHead p{color:#aaa;margin:0;line-height:1.5}.adminGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.adminTabs{display:flex;gap:7px;overflow:auto;padding-bottom:12px;margin-top:12px}.adminTabs button{white-space:nowrap}.adminTabs .active{background:#ff913225;border-color:#ff8b46;color:#ffb677}.mcList{display:grid;gap:8px}.mcRow{display:flex;align-items:center;gap:8px;border:1px solid #ffffff20;background:#121214;padding:10px;border-radius:11px}.mcRow strong{flex:1}.mcRow .avatar{width:43px;height:43px;font-size:17px}.mcRow small{color:#aaa;font-size:11px}.note{border:1px solid #ff8a2650;background:#ff84240e;border-radius:12px;color:#ffc48d;padding:12px;font-size:12px;line-height:1.5;margin:12px 0}.empty{text-align:center;padding:28px 12px;color:#b3a7a1;border:1px dashed #ffffff35;border-radius:13px}.separator{border:0;border-top:1px solid #ffffff20;margin:15px 0}.wide{width:100%}.hide{display:none!important}.dialogBackdrop{position:fixed;inset:0;z-index:100;background:#000c;display:grid;place-items:center;padding:12px}.dialog{background:#1b191a;border:1px solid #ff914966;box-shadow:0 20px 80px #0009;max-height:94dvh;overflow:auto;border-radius:20px;padding:24px;width:min(540px,100%)}.dialog h2{font:30px Anton;margin:8px 0 15px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;padding:12px 15px;border:1px solid #fa973f;background:#161417;color:white;border-radius:10px;min-width:230px;text-align:center;box-shadow:0 8px 30px #0009;font-size:13px;max-width:90%}footer{border-top:1px solid var(--edge);padding:24px;text-align:center;color:#a89f99;font-size:12px}.status{font-size:12px;color:var(--green);font-weight:800}.disabled{opacity:.6;pointer-events:none}@media(max-width:850px){.desktopnav{display:none}.menuBtn{display:block}.twocol{grid-template-columns:1fr}.banner{min-height:200px}.rankGrid{grid-template-columns:1fr}.bracketStage{grid-template-columns:1fr}}@media(max-width:530px){main{padding:12px 11px 75px}.topbar{padding:0 12px;height:62px}.brandText{font-size:18px}.banner{padding:21px 18px}.banner h1{font-size:42px}.section{padding:15px;margin-top:16px}.hall{gap:7px}.hallCard{padding:11px 4px}.hallCard .avatar{width:57px;height:57px;font-size:26px}.hallCard .titles{font-size:10px}.fighter .avatar{width:65px;height:65px;font-size:25px}.compare{grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr)}.vs b{font-size:29px}.vs strong{font-size:15px}.fighter select{font-size:11px;padding:6px}.hallCard strong{font-size:13px}.adminGrid{grid-template-columns:1fr}table{min-width:400px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><div class="topbar"><div class="brand" role="button" onclick="navTo('home')"><div class="brandMark">BDF</div><div class="brandText">BATALHA DA FOICE<small>VERSÃO 10 • PRÉVIA</small></div></div><nav class="desktopnav" id="desktopNav"></nav><button class="menuBtn" onclick="toggleMenu()" id="menuBtn" aria-label="Abrir menu" aria-expanded="false">☰</button></div><nav id="mobilemenu" class="mobilemenu"></nav></header>
<main><div id="app"></div></main><footer>© Batalha da Foice · Prévia navegável da V10<br>Esta demonstração roda no navegador; não publica nem altera a V9.</footer>
<div id="modalRoot"></div><div class="toast hide" id="toast" role="status"></div>
<script>
const BASE=[['Vieira Zr',81,'Itaborai','estadual'],['Jotapê',34,'Itaborai (RJ)'],['R10',30,'Itaborai (RJ)'],['Antares',22,'Tangua (RJ)','estadual'],['Frazão',18,'Itaborai'],['Nobruxxo',14,'Itaborai'],['Audaz',12,'São Gonçalo (RJ)'],['Jotagê',10,'Itaborai'],['J²',9,'Itaborai'],['Zel',7,'Itaborai (RJ)'],['W',7,'São Gonçalo (RJ)','estadual'],['DestroAk',5,'Itaborai'],['Dia',5,'Itaborai'],['Street',5,'Itaborai (RJ)','regional'],['Gaab',4,'Itaborai'],['Indio',3,'Macaé (RJ)'],['Dubeck',3,'Itaborai'],['MC Pretinho',3,'Itaborai (RJ)'],['Alcantara',2,'Itaborai'],['M4',2,'Cachoeira de Macacu'],['Quintanilha',2,'Itaborai (RJ)'],['Midas',2,'Itaborai (RJ)'],['Noth',1,'Cachoeira De Macacu (RJ)','estadual'],['Rico Mesquita',1,'Baixada (RJ)'],['MT',1,'Rio de Janeiro (RJ)'],['Draco',1,''],['Athena BXD',1,'Baixada (RJ)'],['Efraim',1,'Cachoeira de Macacu (RJ)'],['Schuler',1,'Rio de Janeiro (RJ)']].map((m,i)=>({id:'m'+i,name:m[0],titles:m[1],city:m[2],rep:m[3]||'',tags:[],videos:[]}));
const DEFAULT=()=>({mcs:structuredClone(BASE),annual:{year:2026,points:{},members:BASE.slice(0,16).map(m=>m.id),rules:{segunda:2,semi:4,final:7,campeao:10,bonus:1}},bracket:{players:['Vieira Zr','Jotapê','R10','Antares','Frazão','Nobruxxo','Audaz','Jotagê'],thirds:{},scores:{},winners:{}},version:1});
const storeKey='bdf_v10_offline_demo_1';let state=DEFAULT(),route='home',admin=false,adminTab='mcs',cmpA='m0',cmpB='m1';try{const d=JSON.parse(localStorage.getItem(storeKey)||'null');if(d&&d.version===1)state=d}catch{}
const $=id=>document.getElementById(id),h=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const initials=s=>(s||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();const avatar=(m,cls='')=>'<span class="avatar '+cls+'">'+h(initials(m?.name))+'</span>';const mBy=id=>state.mcs.find(m=>m.id===id);const mName=n=>state.mcs.find(m=>m.name===n);const titles=m=>Number(m?.titles||0);const sorted=()=>state.mcs.filter(m=>titles(m)>0).sort((a,b)=>titles(b)-titles(a)||a.name.localeCompare(b.name,'pt-BR'));const box=(k,t,body)=>'<section class="section"><div class="kicker">'+k+'</div><h2>'+t+'</h2>'+body+'</section>';
const navs=[['home','Início'],['ranking','Ranking geral'],['anual','Ranking anual'],['duelo','Confronto direto'],['edicoes','Edições']];function navTo(n){route=n;closeMenu();render();scrollTo({top:0,behavior:'smooth'})}function toggleMenu(){$('mobilemenu').classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',$('mobilemenu').classList.contains('open'))}function closeMenu(){$('mobilemenu').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false')}
function navHTML(){return navs.map(([r,s])=>'<button type="button" class="'+(r===route?'active':'')+'" onclick="navTo(\''+r+'\')">'+s+'</button>').join('')}
function head(title,sub){return '<div class="pageHead"><div class="kicker">Batalha da Foice • V10</div><h2>'+title+'</h2><p>'+sub+'</p></div>'}
function hall(){let l=sorted().slice(0,3);return box('Galeria de lendas','Hall dos Campeões','<div class="hall">'+l.map((m,i)=>'<button class="hallCard" onclick="profile(\''+m.id+'\')"><span class="place">'+(i+1)+'º LUGAR</span>'+avatar(m)+'<strong>'+h(m.name)+'</strong><span class="titles">'+m.titles+' títulos</span></button>').join('')+'</div>')}
function rankPreview(){const l=sorted().slice(0,5);return box('Ranking histórico','Liderança por títulos','<div class="mcList">'+l.map((m,i)=>'<button class="card rankCard" onclick="profile(\''+m.id+'\')">'+avatar(m)+'<div><strong>#'+(i+1)+' '+h(m.name)+'</strong><small>'+h(m.city||'Local não informado')+'</small></div><span>'+titles(m)+' 🏆</span></button>').join('')+'</div><div class="flex" style="margin-top:15px"><button class="btn orange" onclick="navTo(\'ranking\')">Ver ranking completo</button></div>')}
function matchRounds(){const b=state.bracket;let a=b.players.slice(),rounds=[];for(let r=0;a.length>1;r++){const matches=[],next=[];for(let i=0;i<a.length;i+=2){const k=r+'-'+i/2,parts=[a[i],a[i+1],b.thirds[k]].filter(Boolean),winner=b.winners[k];matches.push({key:k,parts,winner,score:b.scores[k]||[],round:r});next.push(parts.includes(winner)?winner:'')}rounds.push(matches);a=next}return rounds}
function bracketHTML(){let rounds=matchRounds();return '<div class="note">Exemplo de chaveamento editável com MCs cadastrados. Os confrontos e resultados aqui são somente uma simulação — nenhum resultado real foi atribuído.</div><div class="bracketStage">'+rounds.map((ms,i)=>'<div class="card"><div class="kicker" style="margin:0 0 12px">'+(i===0?'Primeira fase':i===rounds.length-1?'Final':'Segunda fase')+'</div>'+ms.map(m=>'<div class="match"><small class="muted">Confronto '+(m.key.split('-')[1]*1+1)+'</small>'+m.parts.map((p,j)=>'<div class="participant '+(m.winner===p?'win':'')+'"><strong>'+h(p)+'</strong><span class="score">'+h(m.score[j]??'—')+(m.winner===p?' ★':'')+'</span></div>').join('')+'<div class="matchFoot">'+(m.winner?'Vencedor: '+h(m.winner):'Aguardando resultado')+'</div></div>').join('')+'</div>').join('')+'</div>'}
function highlight(){return box('Últimas notícias','Destaques da semana','<div class="twocol"><div class="card"><small class="muted">Campeão da última edição</small><h3>A definir</h3><p class="hint">Nenhuma edição real foi carregada nesta demonstração.</p></div><div class="card"><small class="muted">Rima em destaque</small><h3>Aguardando vídeo</h3><p class="hint">Adicione um link do YouTube a um MC pelo painel de demonstração.</p></div></div>')}
function home(){return '<div class="banner"><div class="kicker">Freestyle • Batalha da Foice</div><h1>O PESO DE CADA <em>RIMA.</em></h1><p>Conheça os campeões, compare MCs e acompanhe o chaveamento da edição — agora com ranking anual e perfis de rimas.</p><span class="tagline">V10 • DEMONSTRAÇÃO INTERATIVA</span></div>'+box('Chaveamentos','Última edição',bracketHTML())+hall()+rankPreview()+box('Rivalidade','Confronto direto',comparison(false))+'<div class="flex" style="margin-top:19px"><button class="btn orange wide" onclick="navTo(\'anual\')">Abrir Ranking Anual · TOP 16</button></div>'+highlight()}
function ranking(){return head('Ranking Geral de Campeões','O ranking histórico exibe apenas MCs com títulos. Participantes sem títulos continuam cadastrados e podem disputar o ranking anual.')+box('Títulos registrados','Classificação histórica','<div class="rankGrid">'+sorted().map((m,i)=>'<button class="card rankCard" onclick="profile(\''+m.id+'\')">'+avatar(m)+'<div><strong>#'+(i+1)+' '+h(m.name)+'</strong><small>'+h(m.city||'Local não informado')+'</small></div><span>'+titles(m)+' 🏆</span></button>').join('')+'</div>')}
function yearly(){const a=state.annual;const people=a.members.map(mBy).filter(Boolean).map(m=>({...m,points:Number(a.points[m.id]||0)})).sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name,'pt-BR')).slice(0,16);return head('Ranking Anual · TOP 16','Classificação estilo Brasileirão. Sem resultados cadastrados, a prévia começa com pontuação zero; você pode simular pontos pelo painel ADM.')+box('Temporada '+a.year,'Classificação anual','<div class="tablewrap"><table><thead><tr><th>#</th><th>MC</th><th>Vitórias</th><th>Pontos</th></tr></thead><tbody>'+people.map((m,i)=>'<tr><td>'+(i+1)+'º</td><td><button onclick="profile(\''+m.id+'\')">'+h(m.name)+'</button></td><td>—</td><td style="color:#ffb577;font-weight:800">'+m.points+'</td></tr>').join('')+'</tbody></table></div><p class="hint">Regras iniciais: segunda fase +2; semifinal +4; vice +7; campeão +10; bônus por 2×0 +1. Só a maior fase conta por edição.</p>')}
function comparison(full=true){const a=mBy(cmpA)||state.mcs[0],b=mBy(cmpB)||state.mcs[1];let select=(m,s)=>'<select class="select" aria-label="Selecionar MC" onchange="setCompare(\''+s+'\',this.value)">'+state.mcs.map(x=>'<option value="'+h(x.id)+'" '+(m?.id===x.id?'selected':'')+'>'+h(x.name)+'</option>').join('')+'</select>';return (full?'<div class="note">Placar histórico ainda não disponível: esta demonstração não possui resultados reais entre MCs. Não foram inventadas vitórias.</div>':'')+'<div class="compare"><div class="fighter">'+avatar(a)+select(a,'A')+'<strong>0 vitórias</strong></div><div class="vs"><b>VS</b><strong>0 × 0</strong><small>Sem registros</small></div><div class="fighter">'+avatar(b)+select(b,'B')+'<strong>0 vitórias</strong></div></div>'}
function duelo(){return head('Confronto Direto','Compare dois MCs e consulte o placar histórico das batalhas registradas.')+box('MC versus MC','Histórico individual',comparison())}
function edicoes(){return head('Edições e Chaveamentos','O sistema suporta confronto tradicional e Double Three, com três pontuações individuais e um vencedor.')+box('Prévia do chaveamento','Modelo de edição',bracketHTML())}
function videos(m){const vids=(m.videos||[]);return vids.length?'<h3>Melhores rimas</h3>'+vids.map(v=>{const match=String(v.url||'').match(/(?:youtu\.be\/|[?&]v=)([A-Za-z0-9_-]{11})/);return match?'<div class="card"><p>'+h(v.title)+'</p><div style="aspect-ratio:16/9"><iframe style="width:100%;height:100%;border:0;border-radius:10px" loading="lazy" src="https://www.youtube-nocookie.com/embed/'+h(match[1])+'" title="'+h(v.title)+'" allowfullscreen></iframe></div></div>':'<p>Vídeo indisponível</p>'}).join(''):'<p class="hint">Nenhum vídeo foi cadastrado na demonstração para este MC.</p>'}
function profile(id){const m=mBy(id);if(!m)return;openModal('<div class="flex">'+avatar(m)+'<div><div class="kicker">Perfil do MC</div><h2 style="margin:6px 0">'+h(m.name)+'</h2><span class="muted">'+h(m.city)+'</span></div></div><hr class="separator"><div class="twocol"><div class="card"><small class="muted">Títulos históricos</small><h2>'+titles(m)+'</h2></div><div class="card"><small class="muted">Representação</small><h3>'+h(m.rep||'Não informada')+'</h3></div></div><h3>Tags</h3><p>'+h((m.tags||[]).join(' · ')||'Nenhuma tag cadastrada')+'</p>'+videos(m)+'<div class="flex" style="margin-top:16px"><button class="btn" onclick="closeModal()">Voltar</button></div>')}
function toast(msg){const x=$('toast');x.textContent=msg;x.classList.remove('hide');clearTimeout(toast._t);toast._t=setTimeout(()=>x.classList.add('hide'),3500)}function openModal(html){$('modalRoot').innerHTML='<div class="dialogBackdrop" onclick="if(event.target===this)closeModal()"><div class="dialog"><button style="float:right" class="btn" onclick="closeModal()">✕</button>'+html+'</div></div>';document.body.style.overflow='hidden'}function closeModal(){$('modalRoot').innerHTML='';document.body.style.overflow=''}function setCompare(which,id){if(which==='A')cmpA=id;else cmpB=id;render()}
function enterAdmin(){admin=true;adminTab='mcs';navTo('admin');toast('Modo ADM de demonstração aberto')}function login(){closeMenu();openModal('<div class="kicker">Área administrativa</div><h2>Entrar no painel</h2><p>Na V10 real, este acesso exige sua conta Firebase e as permissões do servidor. Aqui você pode experimentar um painel de demonstração sem login real.</p><div class="note">Prévia local: nenhum dado é enviado ao site público.</div><button class="btn orange wide" onclick="closeModal();enterAdmin()">Abrir painel ADM de demonstração</button>')}
function optsForMC(id){return state.mcs.map(m=>'<option value="'+h(m.id)+'" '+(m.id===id?'selected':'')+'>'+h(m.name)+'</option>').join('')}
let editMc=state.mcs[0].id;function adminPanel(){if(!admin)return home();const tabs=[['mcs','MCs'],['tags','Tags'],['estados','Estados'],['videos','Vídeos'],['anual','Ranking anual'],['chaves','Chaveamentos']];let header=head('Painel administrativo','Demonstração offline dos controles da V10. Editar aqui altera somente esta prévia, não o GitHub ou o site publicado.')+'<div class="note">Acesso ADM pelo celular: menu ☰ → ⚙ Área administrativa. Na V10 do GitHub, será necessário autenticar com Firebase. Esta versão é apenas visual.</div><div class="flex between"><span class="status">● Modo de demonstração</span><button class="btn" onclick="admin=false;navTo(\'home\')">Sair do painel</button></div><div class="adminTabs">'+tabs.map(([k,label])=>'<button class="btn '+(k===adminTab?'active':'')+'" onclick="adminTab=\''+k+'\';render()">'+label+'</button>').join('')+'</div>';
 let body='';if(adminTab==='mcs')body=box('Cadastro','MCs e perfis','<p class="hint">Participantes sem títulos também podem ser cadastrados e entrar no Ranking Anual.</p><div class="flex"><button class="btn orange" onclick="createMC()">+ Novo MC</button></div><div class="mcList" style="margin-top:12px">'+state.mcs.map(m=>'<div class="mcRow">'+avatar(m)+'<strong>'+h(m.name)+'<br><small>'+titles(m)+' títulos</small></strong><button class="btn" onclick="editMC(\''+m.id+'\')">Editar</button></div>').join('')+'</div>');
 if(adminTab==='tags')body=box('Organização','Tags dos MCs','<label class="label">MC</label><select id="tagMC" class="select" onchange="editMc=this.value;render()">'+optsForMC(editMc)+'</select><label class="label">Tags separadas por vírgula</label><input id="tags" class="input" value="'+h((mBy(editMc)?.tags||[]).join(', '))+'" placeholder="Revelação, Representante..."><button class="btn orange" style="margin-top:12px" onclick="saveTags()">Salvar tags</button>');
 if(adminTab==='estados')body=box('Representatividade','Representantes estaduais','<label class="label">MC</label><select id="stateMC" class="select" onchange="editMc=this.value;render()">'+optsForMC(editMc)+'</select><label class="label">Tipo</label><select id="stateRep" class="select"><option value="">Nenhum</option><option value="estadual" '+(mBy(editMc)?.rep==='estadual'?'selected':'')+'>Estadual</option><option value="regional" '+(mBy(editMc)?.rep==='regional'?'selected':'')+'>Regional</option></select><label class="label">Estado/cidade</label><input class="input" id="stateCity" value="'+h(mBy(editMc)?.city||'')+'"><button class="btn orange" style="margin-top:12px" onclick="saveState()">Salvar representante</button>');
 if(adminTab==='videos')body=box('Mídias','Vídeos e rimas','<p class="hint">Adicione links do YouTube ao perfil do MC. Upload de arquivos exige R2 no site real e não funciona nesta prévia offline.</p><label class="label">MC</label><select id="videoMC" class="select" onchange="editMc=this.value;render()">'+optsForMC(editMc)+'</select><label class="label">Título</label><input id="videoTitle" class="input" placeholder="Melhores rimas"><label class="label">URL do YouTube</label><input id="videoUrl" class="input" placeholder="https://www.youtube.com/watch?v=..."><button class="btn orange" style="margin-top:12px" onclick="addVideo()">Adicionar link</button><h3>Vídeos cadastrados</h3><div class="mcList">'+(mBy(editMc)?.videos||[]).map((v,i)=>'<div class="mcRow"><span style="flex:1">'+h(v.title)+'</span><button class="btn" onclick="removeVideo('+i+')">Excluir</button></div>').join('')+'</div>');
 if(adminTab==='anual')body=box('Pontuação','Ranking Anual — configurar','<p class="hint">Valores iniciais: 2, 4, 7, 10 e bônus de 1 por 2×0. Edite os pontos para simular a tabela.</p><div class="adminGrid">'+Object.entries({segunda:'Segunda fase',semi:'Semifinal',final:'Vice',campeao:'Campeão',bonus:'Bônus 2×0'}).map(([k,t])=>'<div><label class="label">'+t+'</label><input class="input" type="number" min="0" max="100" id="rule_'+k+'" value="'+state.annual.rules[k]+'"></div>').join('')+'</div><button class="btn" style="margin-top:12px" onclick="saveRules()">Salvar regras</button><hr class="separator"><label class="label">MC</label><select id="annualMC" class="select">'+optsForMC(editMc)+'</select><label class="label">Adicionar ou retirar pontos (simulação)</label><input class="input" type="number" value="1" id="annualDelta"><button class="btn orange" style="margin-top:12px" onclick="addPoints()">Aplicar pontos</button><p class="hint">Esse ajuste é exclusivamente visual, não representa resultados reais.</p>');
 if(adminTab==='chaves')body=box('Torneios','Editor de chaveamento','<p class="hint">A primeira fase possui quatro confrontos. É possível adicionar um terceiro MC em qualquer confronto, mas somente um avança.</p>'+state.bracket.players.map((n,i)=>'<label class="label">Vaga '+(i+1)+'</label><select class="select" onchange="changePlayer('+i+',this.value)">'+state.mcs.map(m=>'<option value="'+h(m.name)+'" '+(n===m.name?'selected':'')+'>'+h(m.name)+'</option>').join('')+'</select>').join('')+'<h3>Confrontos</h3>'+matchRounds().map((round,r)=>'<h3 style="font-size:17px;color:#ffb676">'+(r===0?'Primeira fase':r===1?'Segunda fase':'Final')+'</h3>'+round.map(m=>'<div class="match"><small class="muted">Confronto '+m.key+'</small>'+m.parts.map((p,i)=>'<div class="participant">'+h(p)+'<input type="number" min="0" max="99" value="'+h(m.score[i]??0)+'" style="max-width:66px" class="input" oninput="setScore(\''+m.key+'\','+i+',this.value)"></div>').join('')+'<div class="flex" style="margin:8px 0"><button class="btn" onclick="addThird(\''+m.key+'\')">'+(m.parts.length===3?'Alterar terceiro MC':'+ Adicionar terceiro MC')+'</button></div><label class="label">Quem avança?</label><select class="select" onchange="setWinner(\''+m.key+'\',this.value)"><option value="">Ainda não definido</option>'+m.parts.map(p=>'<option value="'+h(p)+'" '+(m.winner===p?'selected':'')+'>'+h(p)+'</option>').join('')+'</select></div>').join('')).join('')+'<button class="btn orange" style="margin-top:15px" onclick="saveDemo()">Salvar chave demonstrativa</button>');
 return header+body+'<div class="section"><h2>Salvar alterações</h2><p class="hint">Ao salvar, as mudanças ficam somente neste aparelho. Não serão publicadas no site real.</p><button class="btn orange" onclick="saveDemo()">Salvar prévia local</button> <button class="btn" onclick="resetDemo()">Restaurar demonstração</button></div>';
}
function editMC(id){editMc=id;const m=mBy(id);openModal('<div class="kicker">Editor de MCs</div><h2>Editar '+h(m.name)+'</h2><label class="label">Nome</label><input class="input" id="editName" value="'+h(m.name)+'"><label class="label">Cidade</label><input class="input" id="editCity" value="'+h(m.city)+'"><label class="label">Títulos</label><input class="input" type="number" min="0" id="editTitles" value="'+m.titles+'"><p class="hint">Os dados do site oficial não serão alterados.</p><button class="btn orange" onclick="saveMC()">Salvar MC</button>')}
function createMC(){const m={id:'d'+Date.now(),name:'Novo MC',titles:0,city:'',rep:'',tags:[],videos:[]};state.mcs.push(m);saveDemo(false);render();editMC(m.id)}
function saveMC(){let m=mBy(editMc);if(!m)return;m.name=$('editName').value.trim()||m.name;m.city=$('editCity').value.trim();m.titles=Math.max(0,Number($('editTitles').value)||0);saveDemo(false);closeModal();render();toast('MC editado na prévia local')}
function saveTags(){let m=mBy(editMc);if(!m)return;m.tags=$('tags').value.split(',').map(t=>t.trim()).filter(Boolean).slice(0,20);saveDemo(false);toast('Tags atualizadas')}
function saveState(){let m=mBy(editMc);if(!m)return;m.rep=$('stateRep').value;m.city=$('stateCity').value.trim();saveDemo(false);toast('Representação atualizada')}
function addVideo(){let m=mBy(editMc),url=$('videoUrl').value.trim(),title=$('videoTitle').value.trim();if(!m||!title||!/(?:youtu\.be\/|youtube\.com\/watch\?v=)[A-Za-z0-9_-]{11}/.test(url))return toast('Informe título e link do YouTube válido');m.videos.push({title,url});saveDemo(false);render();toast('Vídeo adicionado ao perfil na prévia')}
function removeVideo(index){mBy(editMc).videos.splice(index,1);saveDemo(false);render()}
function saveRules(){Object.keys(state.annual.rules).forEach(k=>state.annual.rules[k]=Math.max(0,Number($('rule_'+k).value)||0));saveDemo(false);toast('Regras salvas na prévia')}
function addPoints(){const id=$('annualMC').value,n=Number($('annualDelta').value)||0;state.annual.points[id]=(state.annual.points[id]||0)+n;saveDemo(false);toast('Pontuação simulada alterada')}
function changePlayer(i,name){state.bracket.players[i]=name;state.bracket.scores={};state.bracket.winners={};saveDemo(false);render()}
function addThird(key){const selected=state.bracket.thirds[key]||'';const text=prompt('Digite o nome exato do terceiro MC (ou deixe vazio para remover):',selected);if(text===null)return;const name=text.trim();if(name&&!mName(name))return toast('MC não cadastrado. Escolha um MC existente.');if(name){state.bracket.thirds[key]=name}else delete state.bracket.thirds[key];delete state.bracket.scores[key];delete state.bracket.winners[key];saveDemo(false);render()}
function setScore(key,i,value){const s=state.bracket.scores[key]||[];s[i]=Math.max(0,Number(value)||0);state.bracket.scores[key]=s;saveDemo(false)}
function setWinner(key,name){state.bracket.winners[key]=name;saveDemo(false);render()}
function saveDemo(msg=true){try{localStorage.setItem(storeKey,JSON.stringify(state));if(msg)toast('Prévia salva neste navegador')}catch{toast('Não foi possível salvar neste aparelho')}}
function resetDemo(){if(!confirm('Restaurar dados da demonstração?'))return;state=DEFAULT();editMc=state.mcs[0].id;saveDemo(false);render();toast('Demonstração restaurada')}
function render(){const desktop=$('desktopNav'),mobile=$('mobilemenu');desktop.innerHTML=navHTML();mobile.innerHTML=navHTML()+'<button type="button" class="adminLink" onclick="login()">⚙ Área administrativa</button>';const views={home,ranking,anual:yearly,duelo,edicoes,admin:adminPanel};$('app').innerHTML=(views[route]||home)();}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.ctrlKey&&e.shiftKey&&e.code==='KeyA'){e.preventDefault();login()}});render();
</script></body></html>
